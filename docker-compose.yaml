services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - sqlite_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:
  sqlite_data:

networks:
  app-network:
    driver: bridge
